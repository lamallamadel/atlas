<ds-dialog-header (close)="onCancel()">
  <div style="display: flex; align-items: center; gap: 12px;">
    <ds-icon name="edit" [size]="24" aria-hidden="true"></ds-icon>
    <span>{{ isEdit ? 'Modifier' : 'Ajouter' }} une note</span>
  </div>
</ds-dialog-header>

<ds-dialog-content>
  <div class="ds-form-stack">
    <ds-select
      label="Visibilité"
      [options]="visibilityOptions"
      [(ngModel)]="noteVisibility"
      prefixIcon="eye"
      [required]="true">
    </ds-select>

    <div class="ds-field">
      <label class="ds-field__label">Contenu de la note</label>
      <div class="ds-field__wrap">
        <textarea
          class="ds-field__input"
          [(ngModel)]="noteContent"
          placeholder="Rédigez votre note ici..."
          rows="8"
          style="height: auto; padding: 12px;"></textarea>
      </div>
    </div>

    @if (noteVisibility === ActivityVisibility.CLIENT_VISIBLE) {
      <div class="visibility-warning" style="background: var(--ds-warning-hl); padding: 12px; border-radius: var(--ds-radius-md); display: flex; gap: 12px; align-items: center;">
        <ds-icon name="info" [size]="20" style="color: var(--ds-warning);"></ds-icon>
        <span style="font-size: 13px; color: var(--ds-warning-dark);">Attention: Cette note sera visible par le client dans son espace dédié.</span>
      </div>
    }
  </div>
</ds-dialog-content>

<ds-dialog-actions align="end">
  <ds-button variant="ghost" size="md" (dsClick)="onCancel()">
    Annuler
  </ds-button>
  <ds-button
    variant="marine"
    size="md"
    (dsClick)="onSave()"
    [disabled]="isContentEmpty()">
    <ds-icon name="check" [size]="20" style="margin-right: 8px;"></ds-icon>
    <span>{{ isEdit ? 'Enregistrer' : 'Ajouter la note' }}</span>
  </ds-button>
</ds-dialog-actions>
