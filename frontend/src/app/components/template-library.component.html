<div class="template-library ds-form-stack" style="padding: 24px;">
  <ds-card [pad]="true" elevation="sm">
    <div class="library-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 800; color: var(--ds-marine);">Bibliothèque de modèles</h2>
      <ds-button variant="marine" size="md" (dsClick)="createTemplate()">
        <ds-icon name="plus" [size]="16" style="margin-right: 8px;"></ds-icon>
        Créer un modèle
      </ds-button>
    </div>

    <!-- Filters -->
    <div class="filters-row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; align-items: flex-end; margin-bottom: 32px; padding: 20px; background: var(--ds-bg-subtle); border-radius: var(--ds-radius-md);">
      <ds-input label="Rechercher" [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()" placeholder="Nom du modèle..." prefixIcon="search"></ds-input>
      <ds-select label="Catégorie" [options]="categories" [(ngModel)]="selectedCategory" (ngModelChange)="applyFilters()"></ds-select>
      <ds-select label="Statut" [options]="statuses" [(ngModel)]="selectedStatus" (ngModelChange)="applyFilters()"></ds-select>
      <ds-select label="Langue" [options]="languages" [(ngModel)]="selectedLanguage" (ngModelChange)="applyFilters()"></ds-select>
      <ds-button variant="ghost" size="md" (dsClick)="clearFilters()">Effacer</ds-button>
    </div>

    <!-- Table -->
    @if (loading) {
      <div style="padding: 48px 0;">
        <ds-skeleton variant="rect" width="100%" height="300px" [animate]="true"></ds-skeleton>
      </div>
    }

    @if (!loading) {
      <ds-table
        [columns]="dsColumns"
        [rows]="filteredTemplates"
        [rowActions]="dsRowActions"
        (rowAction)="onRowAction($event)"
        emptyTitle="Aucun modèle trouvé"
        emptyDescription="Ajustez vos filtres ou créez un nouveau modèle.">
        
        <ng-template dsCell="name" let-t>
          <span style="font-weight: 700; color: var(--ds-marine);">{{ t.name }}</span>
        </ng-template>

        <ng-template dsCell="status" let-t>
          <ds-badge [status]="getStatusBadgeStatus(t.status)" [showDot]="false" size="sm">{{ t.status }}</ds-badge>
        </ng-template>

        <ng-template dsCell="updatedAt" let-t>
          {{ t.updatedAt | date:'short' }}
        </ng-template>
      </ds-table>
    }
  </ds-card>
</div>
