<div class="datetime-wrapper ds-form-stack" [formGroup]="form">
  <div class="datetime-row" style="display: flex; gap: 12px; align-items: flex-end;">
    <div class="ds-field" style="flex: 2;">
      @if (label()) {
        <label class="ds-field__label">{{ label() }} @if (required()) { <span style="color: var(--ds-error);">*</span> }</label>
      }
      <div class="ds-field__wrap">
        <input 
          type="date" 
          class="ds-field__input" 
          formControlName="date"
          (blur)="markTouched()" />
      </div>
    </div>

    <div class="ds-field" style="flex: 1;">
      <label class="ds-field__label">Heure</label>
      <div class="ds-field__wrap">
        <input 
          type="time" 
          class="ds-field__input" 
          formControlName="time"
          (blur)="markTouched()" />
      </div>
    </div>
  </div>

  @if (form.touched && form.invalid) {
    <div class="datetime-errors" style="margin-top: 4px; font-size: 12px; color: var(--ds-error);" aria-live="polite">
      @if (form.errors?.['required'] || form.get('date')?.errors?.['required'] || form.get('time')?.errors?.['required']) {
        <div class="datetime-error">Ce champ est requis (date et heure)</div>
      }
    </div>
  }
</div>
