<ds-dialog-header (close)="close()">
  <div style="display: flex; align-items: center; gap: 12px;">
    <ds-icon name="download" [size]="24" aria-hidden="true"></ds-icon>
    <span>Exporter les dossiers</span>
  </div>
</ds-dialog-header>

<ds-dialog-content>
  <div class="ds-form-stack">
    <ds-card [pad]="true" elevation="xs" style="margin-bottom: 24px;">
      <h3 style="margin: 0 0 16px; font-size: 14px; font-weight: 700; color: var(--ds-marine);">Filtres d'export</h3>
      
      <div class="ds-form-stack">
        <ds-select
          label="Filtrer par statut"
          [options]="statusOptions"
          [(ngModel)]="statusFilter"
          prefixIcon="filter">
        </ds-select>

        <ds-select
          label="Filtrer par source"
          [options]="sourceOptions"
          [(ngModel)]="sourceFilter"
          prefixIcon="megaphone">
        </ds-select>

        <div class="ds-form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <ds-input
            label="Date de début"
            type="date"
            [(ngModel)]="startDate"
            prefixIcon="calendar">
          </ds-input>

          <ds-input
            label="Date de fin"
            type="date"
            [(ngModel)]="endDate"
            prefixIcon="calendar">
          </ds-input>
        </div>
      </div>
    </ds-card>

    <ds-card [pad]="true" elevation="xs">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 14px; font-weight: 700; color: var(--ds-marine);">Colonnes à inclure</h3>
        <div style="display: flex; gap: 12px;">
          <ds-button variant="ghost" size="sm" (dsClick)="selectAllColumns()">Tout cocher</ds-button>
          <ds-button variant="ghost" size="sm" (dsClick)="deselectAllColumns()">Tout décocher</ds-button>
        </div>
      </div>

      <div class="columns-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        @for (col of columns; track col.value) {
          <ds-checkbox
            [(ngModel)]="col.selected"
            [label]="col.label">
          </ds-checkbox>
        }
      </div>
    </ds-card>

    @if (isExporting) {
      <div class="export-status" style="margin-top: 24px; text-align: center;">
        <ds-progress-bar mode="indeterminate" variant="primary" style="margin-bottom: 12px;"></ds-progress-bar>
        <p style="margin: 0; font-size: 14px; font-weight: 600;">Préparation de l'export...</p>
      </div>
    }
  </div>
</ds-dialog-content>

<ds-dialog-actions align="end">
  <ds-button variant="ghost" size="md" (dsClick)="close()" [disabled]="isExporting">
    Annuler
  </ds-button>
  <ds-button
    variant="marine"
    size="md"
    (dsClick)="exportLeads()"
    [disabled]="!canExport()">
    @if (isExporting) {
      <span class="spinner-small" style="margin-right: 8px; border-color: rgba(255,255,255,0.3); border-top-color: #fff;"></span>
    } @else {
      <ds-icon name="download" [size]="20" style="margin-right: 8px;"></ds-icon>
    }
    <span>{{ isExporting ? 'Exportation...' : 'Télécharger le CSV' }}</span>
  </ds-button>
</ds-dialog-actions>
