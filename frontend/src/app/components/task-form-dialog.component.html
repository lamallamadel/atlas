<div appFocusTrap role="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description" aria-modal="true" class="ds-task-dialog">
  <ds-dialog-header (close)="onCancel()">
    <ds-icon name="tasks" [size]="24" aria-hidden="true"></ds-icon>
    <span>{{ isEditMode ? 'Modifier la tâche' : 'Nouvelle tâche' }}</span>
  </ds-dialog-header>
  
  <ds-dialog-content>
    <form [formGroup]="taskForm" class="ds-form-stack">
      
      <ds-input
        label="Titre"
        placeholder="Entrer le titre de la tâche"
        formControlName="title"
        [error]="titleError"
        required="true">
      </ds-input>

      <div class="ds-field">
        <label for="task-form-dialog-field-19" class="ds-field__label">Description</label>
        <div class="ds-field__wrap">
          <textarea id="task-form-dialog-field-19"
            class="ds-field__input"
            formControlName="description"
            placeholder="Détails de la tâche..."
            rows="4"
            style="height: auto; padding: 12px;"></textarea>
        </div>
        <p class="ds-field__hint" style="text-align: right; font-size: 11px; margin-top: 4px; color: var(--ds-text-muted);">
          {{ taskForm.get('description')?.value?.length || 0 }} / 1000
        </p>
      </div>

      <div class="ds-form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <ds-select
          label="Assigné à"
          [options]="userOptions"
          formControlName="assignedTo"
          prefixIcon="user">
        </ds-select>

        <div class="ds-field">
          <label for="task-form-dialog-field-42" class="ds-field__label">Échéance</label>
          <div class="ds-field__wrap">
            <input id="task-form-dialog-field-42" 
              type="date" 
              class="ds-field__input" 
              formControlName="dueDate" />
          </div>
        </div>
      </div>

      <ds-select
        label="Priorité"
        [options]="priorities"
        formControlName="priority"
        prefixIcon="filter">
      </ds-select>

    </form>
  </ds-dialog-content>

  <ds-dialog-actions align="end">
    <ds-button variant="ghost" size="md" (dsClick)="onCancel()" [disabled]="loading">
      Annuler
    </ds-button>
    <ds-button
      variant="marine"
      size="md"
      (dsClick)="onSubmit()"
      [disabled]="!taskForm.valid || loading">
      @if (loading) {
        <ds-skeleton variant="circle" width="20px" height="20px" aria-hidden="true"></ds-skeleton>
      }
      <span>{{ isEditMode ? 'Mettre à jour' : 'Créer' }}</span>
    </ds-button>
  </ds-dialog-actions>
</div>
