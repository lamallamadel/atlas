<ds-dialog-header (close)="onCancel()">
  <div style="display: flex; align-items: center; gap: 12px;">
    <ds-icon name="mail" [size]="24" aria-hidden="true"></ds-icon>
    <span>Enregistrer un message</span>
  </div>
</ds-dialog-header>

<ds-dialog-content>
  <form [formGroup]="messageForm" class="ds-form-stack">
    <div class="ds-form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <ds-select
        label="Canal"
        [options]="channelOptions"
        formControlName="channel"
        prefixIcon="megaphone"
        [required]="true">
      </ds-select>

      <ds-select
        label="Direction"
        [options]="directionOptions"
        formControlName="direction"
        prefixIcon="refresh"
        [required]="true">
      </ds-select>
    </div>

    <app-datetime-picker
      formControlName="timestamp"
      [required]="true"
      label="Date et heure du message">
    </app-datetime-picker>

    <div class="ds-field">
      <label class="ds-field__label">Contenu du message</label>
      <div class="ds-field__wrap">
        <textarea
          class="ds-field__input"
          formControlName="content"
          placeholder="Écrivez le contenu du message ici..."
          rows="6"
          style="height: auto; padding: 12px;"></textarea>
      </div>
      @if (getErrorMessage('content')) {
        <span class="ds-field__error">{{ getErrorMessage('content') }}</span>
      }
    </div>
  </form>
</ds-dialog-content>

<ds-dialog-actions align="end">
  <ds-button variant="ghost" size="md" (dsClick)="onCancel()" [disabled]="isSubmitting">
    Annuler
  </ds-button>
  <ds-button
    variant="marine"
    size="md"
    (dsClick)="onSubmit()"
    [disabled]="!messageForm.valid || isSubmitting">
    @if (isSubmitting) {
      <span class="spinner-small" style="margin-right: 8px; border-color: rgba(255,255,255,0.3); border-top-color: #fff;"></span>
    } @else {
      <ds-icon name="check" [size]="20" style="margin-right: 8px;"></ds-icon>
    }
    <span>{{ isSubmitting ? 'En cours...' : 'Enregistrer' }}</span>
  </ds-button>
</ds-dialog-actions>
