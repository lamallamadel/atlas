<div class="api-status-indicator" [class]="getStatusClass()">
  <span class="api-status-menu-origin" cdkOverlayOrigin #apiStatusOrigin="cdkOverlayOrigin">
    <ds-button
      variant="ghost"
      size="sm"
      class="status-button"
      (dsClick)="toggleStatusMenu()"
      [attr.aria-expanded]="statusMenuOpen"
      aria-haspopup="menu"
      aria-controls="api-status-menu"
      [title]="getTooltipText()"
      style="padding: 4px 8px; height: 32px; border-radius: 16px;">
      <span class="status-dot" style="width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; display: inline-block;"></span>
      <span class="status-text" style="font-size: 12px; font-weight: 600;">{{ getStatusText() }}</span>
    </ds-button>
  </span>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="apiStatusOrigin"
    [cdkConnectedOverlayOpen]="statusMenuOpen"
    [cdkConnectedOverlayPositions]="statusMenuPositions"
    [cdkConnectedOverlayScrollStrategy]="statusMenuScrollStrategy"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayBackdropClass]="'ds-menu-backdrop'"
    (backdropClick)="closeStatusMenu()"
    (detach)="closeStatusMenu()"
    (overlayKeydown)="$event.key === 'Escape' && closeStatusMenu()">
    <ds-card id="api-status-menu" class="api-status-dropdown" [pad]="true" elevation="md" style="min-width: 240px;" role="menu">
      <div class="status-menu-content">
        <div class="status-info" style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px;">
          <ds-icon
            class="status-menu-leading-icon"
            [class.status-connected]="apiStatus === 'connected'"
            [class.status-disconnected]="apiStatus === 'disconnected'"
            [class.status-checking]="apiStatus === 'checking'"
            [name]="statusMenuIcon()"
            [size]="24"
            aria-hidden="true" />
          <div class="status-details">
            <div class="status-label" style="font-weight: 700; font-size: 14px; color: var(--ds-marine);">{{ getStatusText() }}</div>
            @if (lastChecked) {
              <div class="status-timestamp" style="font-size: 11px; color: var(--ds-text-faint);">
                Dernière vérification: {{ lastChecked | date:'short' }}
              </div>
            }
          </div>
        </div>
      </div>
      
      <div class="layout-divider" style="margin: 12px -16px; height: 1px; background: var(--ds-divider);"></div>
      
      <ds-button
        variant="ghost"
        size="sm"
        style="width: 100%; justify-content: flex-start;"
        (dsClick)="checkApiConnection()"
        [disabled]="apiStatus === 'checking'">
        <ds-icon name="refresh" [size]="16" style="margin-right: 12px;"></ds-icon>
        <span>Actualiser</span>
      </ds-button>
    </ds-card>
  </ng-template>
</div>
