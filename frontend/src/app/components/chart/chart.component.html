<div class="chart-wrapper" [class.dark-mode]="darkMode()">
  @if (title() || subtitle() || enableExport()) {
    <div class="chart-header">
      <div class="chart-title-section">
        @if (title()) {
          <h3 class="chart-title">{{ title() }}</h3>
        }
        @if (subtitle()) {
          <p class="chart-subtitle">{{ subtitle() }}</p>
        }
      </div>
      @if (enableExport()) {
        <div class="chart-actions">
          <span class="chart-export-menu-origin" cdkOverlayOrigin #chartExportOrigin="cdkOverlayOrigin">
            <button
              type="button"
              class="chart-export-trigger"
              (click)="toggleChartExportMenu()"
              [attr.aria-expanded]="chartExportMenuOpen"
              aria-haspopup="menu"
              aria-controls="chart-export-menu"
              [attr.title]="'Exporter le graphique'"
              aria-label="Exporter le graphique">
              <ds-icon name="download" [size]="20" aria-hidden="true" />
            </button>
          </span>
          <ng-template
            cdkConnectedOverlay
            [cdkConnectedOverlayOrigin]="chartExportOrigin"
            [cdkConnectedOverlayOpen]="chartExportMenuOpen"
            [cdkConnectedOverlayPositions]="chartExportMenuPositions"
            [cdkConnectedOverlayScrollStrategy]="chartExportMenuScrollStrategy"
            [cdkConnectedOverlayHasBackdrop]="true"
            [cdkConnectedOverlayBackdropClass]="'ds-menu-backdrop'"
            (backdropClick)="closeChartExportMenu()"
            (detach)="closeChartExportMenu()"
            (overlayKeydown)="$event.key === 'Escape' && closeChartExportMenu()">
            <div id="chart-export-menu" class="chart-export-dropdown" role="menu">
              <button type="button" class="chart-export-item" role="menuitem" (click)="exportChart({ format: 'png' })">
                <ds-icon name="image" [size]="20" aria-hidden="true" />
                <span>Exporter en PNG</span>
              </button>
              <button type="button" class="chart-export-item" role="menuitem" (click)="exportChart({ format: 'svg' })">
                <ds-icon name="code" [size]="20" aria-hidden="true" />
                <span>Exporter en SVG</span>
              </button>
            </div>
          </ng-template>
        </div>
      }
    </div>
  }

  <div class="chart-container" [style.height.px]="height()">
    <canvas #chartCanvas></canvas>
  </div>
</div>
