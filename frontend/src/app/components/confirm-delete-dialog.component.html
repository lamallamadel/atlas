<ds-dialog-header (close)="onCancel()">
  <div style="display: flex; align-items: center; gap: 12px;">
    <ds-icon name="trash" [size]="24" style="color: var(--ds-error);"></ds-icon>
    <span>{{ data.title }}</span>
  </div>
</ds-dialog-header>

<ds-dialog-content>
  <p id="dialog-message" style="margin: 0;">{{ data.message }}</p>
</ds-dialog-content>

<ds-dialog-actions align="end">
  <ds-button variant="ghost" size="md" (dsClick)="onCancel()" [disabled]="isSubmitting">
    Annuler
  </ds-button>
  <ds-button
    variant="danger"
    size="md"
    (dsClick)="onConfirm()"
    [disabled]="isSubmitting">
    @if (isSubmitting) {
      <span class="spinner-small" style="margin-right: 8px; border-color: rgba(255,255,255,0.3); border-top-color: #fff;"></span>
    } @else {
      <ds-icon name="trash" [size]="20" style="margin-right: 8px;"></ds-icon>
    }
    <span>{{ isSubmitting ? 'Suppression...' : 'Supprimer' }}</span>
  </ds-button>
</ds-dialog-actions>
