<div class="workflow" role="group" aria-label="Progression du dossier">
  <div class="workflow-header">
    <div class="workflow-title">
      <ds-icon name="chart" [size]="20" aria-hidden="true" />
      <span>Pipeline dossier</span>
    </div>
    @if (status()) {
      <div class="workflow-meta">
        @if (isClosed) {
          <span class="workflow-chip" [ngClass]="closeVariantClass">
            <ds-icon [name]="isWon ? 'check' : 'close'" [size]="16" aria-hidden="true" />
            <span>{{ isWon ? 'Gagné' : 'Perdu' }}</span>
          </span>
        }
        <span class="workflow-progress" aria-label="Progression">
          {{ progressPercent }}%
        </span>
      </div>
    }
  </div>

  <div class="workflow-track">
    <div class="workflow-bar" [style.width.%]="progressPercent"></div>
  </div>

  <ds-stage-stepper
    class="workflow-stages"
    [stages]="dsStages"
    ariaLabel="Étapes du pipeline dossier" />

  @if (hint) {
    <div class="workflow-hint">
      <ds-icon name="info" [size]="20" aria-hidden="true" />
      <span>{{ hint }}</span>
    </div>
  }
</div>
