<ds-dialog-header (close)="onCancel()">
  <div style="display: flex; align-items: center; gap: 12px;">
    <ds-icon name="user" [size]="24" aria-hidden="true"></ds-icon>
    <span>{{ isEditMode ? 'Modifier' : 'Ajouter' }} une partie prenante</span>
  </div>
</ds-dialog-header>

<ds-dialog-content>
  <form [formGroup]="partieForm" class="ds-form-stack">
    <ds-select
      label="Rôle"
      [options]="roleOptions"
      formControlName="role"
      prefixIcon="user"
      [required]="true">
    </ds-select>

    <div class="ds-form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <ds-input
        label="Prénom"
        formControlName="firstName"
        placeholder="Jean"
        [required]="true"
        [error]="getErrorMessage('firstName')">
      </ds-input>

      <ds-input
        label="Nom"
        formControlName="lastName"
        placeholder="Dupont"
        [required]="true"
        [error]="getErrorMessage('lastName')">
      </ds-input>
    </div>

    <ds-input
      label="Téléphone"
      formControlName="phone"
      placeholder="+33 6 12 34 56 78"
      prefixIcon="phone"
      [error]="getErrorMessage('phone')">
    </ds-input>

    <ds-input
      label="Email"
      formControlName="email"
      placeholder="jean.dupont@example.com"
      prefixIcon="mail"
      [error]="getErrorMessage('email')">
    </ds-input>
  </form>
</ds-dialog-content>

<ds-dialog-actions align="end">
  <ds-button variant="ghost" size="md" (dsClick)="onCancel()" [disabled]="isSubmitting">
    Annuler
  </ds-button>
  <ds-button
    variant="marine"
    size="md"
    (dsClick)="onSubmit()"
    [disabled]="!partieForm.valid || isSubmitting">
    @if (isSubmitting) {
      <span class="spinner-small" style="margin-right: 8px; border-color: rgba(255,255,255,0.3); border-top-color: #fff;"></span>
    } @else {
      <ds-icon name="check" [size]="20" style="margin-right: 8px;"></ds-icon>
    }
    <span>{{ isSubmitting ? 'En cours...' : (isEditMode ? 'Enregistrer' : 'Ajouter') }}</span>
  </ds-button>
</ds-dialog-actions>
