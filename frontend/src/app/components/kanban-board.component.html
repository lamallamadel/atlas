@if (!loading()) {
  <div class="kanban-board" data-tour="kanban">
    <div class="kanban-columns">
      @for (col of dsKanbanColumns; track trackByColumnId($index, col)) {
        <ds-kanban-column
          [column]="col"
          [connectedTo]="kanbanConnectedLists"
          [loading]="false"
          (cardClick)="onKanbanCardClick($event)"
          (cardDropped)="onKanbanCardDropped($event)" />
      }
    </div>
  </div>
}

@if (loading()) {
  <div class="kanban-loading">
    <ds-skeleton variant="circle" width="48px" height="48px"></ds-skeleton>
    <p>Chargement des dossiers...</p>
  </div>
}
