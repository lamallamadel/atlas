<ds-dialog-header (close)="onCancel()">
  <div style="display: flex; align-items: center; gap: 12px;">
    <ds-icon name="calendar" [size]="24" aria-hidden="true"></ds-icon>
    <span>{{ isEditMode ? 'Modifier' : 'Planifier' }} un rendez-vous</span>
  </div>
</ds-dialog-header>

<ds-dialog-content>
  <form [formGroup]="appointmentForm" class="ds-form-stack">
    @if (getFormErrorMessage()) {
      <div class="ds-alert ds-alert--error" role="alert" aria-live="assertive" style="margin-bottom: 24px; display: flex; align-items: center; gap: 12px; background: var(--ds-error-hl); color: var(--ds-error); padding: 12px; border-radius: var(--ds-radius-md);">
        <ds-icon name="info" [size]="20"></ds-icon>
        <span>{{ getFormErrorMessage() }}</span>
      </div>
    }

    <ds-card [pad]="true" elevation="xs" style="margin-bottom: 24px;">
      <div class="section-header" style="margin-bottom: 20px;">
        <h3 style="margin: 0; font-size: 14px; font-weight: 700; color: var(--ds-marine); display: flex; align-items: center; gap: 8px;">
          <ds-icon name="clock" [size]="20"></ds-icon>
          Date et heure
        </h3>
      </div>

      <div class="ds-form-stack">
        <app-datetime-picker
          formControlName="startTime"
          [required]="true"
          label="Date et heure de début">
        </app-datetime-picker>

        <app-datetime-picker
          formControlName="endTime"
          [required]="true"
          label="Date et heure de fin">
        </app-datetime-picker>
      </div>
    </ds-card>

    <ds-card [pad]="true" elevation="xs">
      <div class="section-header" style="margin-bottom: 20px;">
        <h3 style="margin: 0; font-size: 14px; font-weight: 700; color: var(--ds-marine); display: flex; align-items: center; gap: 8px;">
          <ds-icon name="info" [size]="20"></ds-icon>
          Détails du rendez-vous
        </h3>
      </div>

      <div class="ds-form-stack">
        <ds-input
          label="Lieu"
          formControlName="location"
          placeholder="Adresse complète..."
          prefixIcon="map-pin">
        </ds-input>

        <ds-input
          label="Assigné à"
          formControlName="assignedTo"
          placeholder="Nom de l'agent responsable"
          prefixIcon="user">
        </ds-input>

        <div class="ds-form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <ds-select
            label="Statut"
            [options]="statusOptions"
            formControlName="status"
            prefixIcon="filter">
          </ds-select>

          <ds-select
            label="Langue du client"
            [options]="localeOptions"
            formControlName="locale"
            prefixIcon="globe">
          </ds-select>
        </div>

        <div class="ds-field">
          <label class="ds-field__label">Notes</label>
          <div class="ds-field__wrap">
            <textarea
              class="ds-field__input"
              formControlName="notes"
              placeholder="Notes additionnelles..."
              rows="4"
              style="height: auto; padding: 12px;"></textarea>
          </div>
        </div>
      </div>
    </ds-card>
  </form>
</ds-dialog-content>

<ds-dialog-actions align="end">
  <ds-button variant="ghost" size="md" (dsClick)="onCancel()" [disabled]="isSubmitting">
    Annuler
  </ds-button>
  <ds-button
    variant="marine"
    size="md"
    (dsClick)="onSubmit()"
    [disabled]="!appointmentForm.valid || isSubmitting">
    @if (isSubmitting) {
      <span class="spinner-small" style="margin-right: 8px; border-color: rgba(255,255,255,0.3); border-top-color: #fff;"></span>
    } @else {
      <ds-icon [name]="isEditMode ? 'check' : 'calendar'" [size]="20" style="margin-right: 8px;"></ds-icon>
    }
    <span>{{ isSubmitting ? 'En cours...' : (isEditMode ? 'Enregistrer' : 'Planifier') }}</span>
  </ds-button>
</ds-dialog-actions>
