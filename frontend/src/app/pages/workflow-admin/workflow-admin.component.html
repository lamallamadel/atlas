<div class="workflow-admin-container">
  <ds-page-header title="Administration des workflows" subtitle="Gérez vos workflows et modèles WhatsApp d'une manière centralisée."></ds-page-header>
  <ds-card class="workflow-admin-card" [pad]="false" [elevation]="'sm'">
    <div class="workflow-admin-card-body">
      <mat-tab-group [(selectedIndex)]="selectedTab" animationDuration="300ms">
        <mat-tab label="Éditeur">
          <div class="tab-content">
            <div class="workflow-selector">
              <mat-button-toggle-group (change)="onCaseTypeChange($event.value)" [value]="workflow?.caseType">
                <mat-button-toggle [value]="CaseType.DOSSIER">Workflow dossier</mat-button-toggle>
                <mat-button-toggle [value]="CaseType.ANNONCE">Workflow annonce</mat-button-toggle>
              </mat-button-toggle-group>
            </div>

            @if (workflow) {
              <app-workflow-editor></app-workflow-editor>
            }

            <div class="actions">
              <ds-button variant="marine" size="md" (dsClick)="onSaveWorkflow()">
                <ds-icon name="upload" [size]="16" />
                Enregistrer le workflow
              </ds-button>
            </div>
          </div>
        </mat-tab>

        <mat-tab label="Aperçu">
          <div class="tab-content">
            @if (workflow) {
              <app-workflow-preview [workflow]="workflow"></app-workflow-preview>
            }
          </div>
        </mat-tab>

        <mat-tab label="Modèles WhatsApp">
          <div class="tab-content">
            <p class="tab-description">
              Gérez les modèles de messages WhatsApp de votre organisation. Les modèles doivent être approuvés par WhatsApp avant utilisation.
            </p>
            <ds-button variant="marine" size="md" [routerLink]="'/workflow-admin/templates'">
              <ds-icon name="whatsapp" [size]="16" />
              Gérer les modèles
            </ds-button>
          </div>
        </mat-tab>
      </mat-tab-group>
    </div>
  </ds-card>
</div>
