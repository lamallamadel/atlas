spring:
  application:
    name: backend

  batch:
    job:
      name: dailyETLJob

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      json_type: JSONB
  
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

# Brain (FastAPI monolithe) : tous les modules sont servis sur le même port 8000.
brain:
  scoring:
    base-url: ${BRAIN_SCORING_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_SCORING_TIMEOUT:5}
  dupli:
    base-url: ${BRAIN_DUPLI_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_DUPLI_TIMEOUT:30}
  fraud:
    base-url: ${BRAIN_FRAUD_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_FRAUD_TIMEOUT:5}
  match:
    base-url: ${BRAIN_MATCH_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_MATCH_TIMEOUT:10}
  proposal:
    base-url: ${BRAIN_PROPOSAL_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_PROPOSAL_TIMEOUT:15}
  nego:
    base-url: ${BRAIN_NEGO_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_NEGO_TIMEOUT:5}
  agent:
    base-url: ${BRAIN_AGENT_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_AGENT_TIMEOUT:15}
  document:
    base-url: ${BRAIN_DOCUMENT_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_DOCUMENT_TIMEOUT:15}
  # Analyse visuelle des photos : un appel au modèle de vision peut prendre plusieurs dizaines de secondes
  vision:
    base-url: ${BRAIN_VISION_URL:http://localhost:8000}
    api-key: ${BRAIN_API_KEY:change-me-in-production}
    timeout-seconds: ${BRAIN_VISION_TIMEOUT:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:

      show-details: when-authorized
    proposal-service:
      base-url: "http://localhost:8002"
    nego-service:
      base-url: "http://localhost:8003"
    agent-service:
      base-url: "http://localhost:8004"
    document-service:
      base-url: "http://localhost:8005"
    info:
      enabled: true
    prometheus:
      enabled: true

  metrics:
    export:
      prometheus:
        enabled: true
  
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      enabled: true
      remote-fields:
        - sessionId
        - runId
        - hypothesisId
      correlation:
        enabled: true
        fields:
          - sessionId
          - runId
          - hypothesisId
  
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${OTLP_AUTH_HEADER:}
      timeout: ${OTLP_TIMEOUT:10s}
      compression: ${OTLP_COMPRESSION:gzip}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5000}
  training:
    enabled: ${ML_TRAINING_ENABLED:false}
    cron: ${ML_TRAINING_CRON:0 0 2 1 * ?}

logging:
  level:
    root: INFO
    com.example.backend: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# WhatsApp Cloud API (Meta). Identifiants par organisation : table whatsapp_provider_config.
whatsapp:
  cloud:
    api:
      base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v25.0}
  webhook:
    # Doit être identique au « Verify token » saisi dans Meta > WhatsApp > Configuration
    verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

# Adresse publique du frontend : les liens envoyés aux clients (confirmation du
# consentement, portail client) commencent par elle. En production : PUBLIC_BASE_URL.
customer-portal:
  base-url: ${PUBLIC_BASE_URL:http://localhost:4200}

atlas:
  # Cas d'usage n°1 : comptes propriétaires (codes à usage unique, modération a priori).
  owner:
    otp:
      # Modèle WhatsApp de catégorie « authentification » approuvé par Meta ; vide = SMS seul.
      whatsapp-template: ${OWNER_OTP_WHATSAPP_TEMPLATE:}
      whatsapp-language: ${OWNER_OTP_WHATSAPP_LANGUAGE:fr}
      # Jamais en production : écrit le code dans les journaux si aucun fournisseur n'envoie.
      log-codes: ${OWNER_OTP_LOG_CODES:false}
    moderation:
      fraud-threshold: ${OWNER_MODERATION_FRAUD_THRESHOLD:50}
    # Alertes de la messagerie propriétaire ↔ prospect (WhatsApp, sinon e-mail, sinon SMS).
    # Modèles « utilitaires » Meta : une variable {{1}} dans le corps, un bouton « lien » dont
    # l'URL se termine par une variable — propriétaire : <site>/p/{{1}} (c<id> : un contact,
    # d<id> : une demande d'accompagnement), prospect : <site>/contact/{{1}}. Vide = pas de
    # WhatsApp pour cette alerte.
    alerts:
      owner-whatsapp-template: ${OWNER_ALERT_WHATSAPP_TEMPLATE:}
      prospect-whatsapp-template: ${PROSPECT_ALERT_WHATSAPP_TEMPLATE:}
      whatsapp-language: ${OWNER_ALERT_WHATSAPP_LANGUAGE:fr}
      # Jamais en production : écrit le lien dans les journaux si aucun fournisseur n'envoie.
      log-links: ${OWNER_ALERT_LOG_LINKS:false}
  # Cas d'usage n°1, lot B : bourse aux mandats (R-PROP-07, R-PROP-11, R-PROP-16).
  marketplace:
    max-proposals: ${MARKETPLACE_MAX_PROPOSALS:5}
    request-days: ${MARKETPLACE_REQUEST_DAYS:14}
    direct-response-hours: ${MARKETPLACE_DIRECT_RESPONSE_HOURS:72}
    monthly-proposal-quota: ${MARKETPLACE_MONTHLY_PROPOSAL_QUOTA:30}
    pending-signature-days: ${MARKETPLACE_PENDING_SIGNATURE_DAYS:7}
  consent:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
    link-validity-days: ${CONSENT_LINK_VALIDITY_DAYS:7}
